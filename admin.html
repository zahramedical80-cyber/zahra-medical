<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b50"><title>بەڕێوەبردن | Zahra Medical</title><link rel="stylesheet" href="styles.css"><style>
.admin-page{min-height:100vh;background:#f3f8f9}.admin-top{background:#103b50;color:white;padding:24px 0}.admin-top .container{display:flex;align-items:center;justify-content:space-between;gap:15px}.admin-top h1{font-size:22px;margin:0}.admin-top p{font-size:12px;color:#c7e1e6;margin:5px 0 0}.admin-wrap{padding-top:30px;padding-bottom:60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid #e1ebed;border-radius:15px;padding:20px}.stat small{color:#78909a}.stat strong{display:block;font-size:25px;color:#087c9c;margin-top:8px}.admin-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}.panel h2{font-size:17px;margin:0 0 18px}.form-grid{display:grid;gap:11px}.form-grid label{font-size:12px;color:#55717c}.form-grid input,.form-grid select{display:block;width:100%;margin-top:6px;border:1px solid #dce8eb;border-radius:9px;padding:11px;background:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}td,th{text-align:right;padding:12px;border-bottom:1px solid #e8eff1}th{color:#78909a}.del-btn{border:0;background:#fff0f0;color:#b44;padding:7px 10px;border-radius:7px;cursor:pointer}.orders-panel{margin-top:18px}.muted{color:#8198a0;font-size:12px}.admin-nav{display:flex;gap:12px;align-items:center}.admin-nav a{color:white;text-decoration:none;font-size:12px}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:500px){.stats{grid-template-columns:1fr}.admin-top h1{font-size:17px}}
</style></head><body class="admin-page"><header class="admin-top"><div class="container"><div><h1>✚ ZAHRA MEDICAL — داشبۆرد</h1><p>بەڕێوەبردنی بەرهەم، داواکاری و کڕیارەکان</p></div><div class="admin-nav"><a href="index.html">← گەڕانەوە بۆ فرۆشگا</a></div></div></header><main class="container admin-wrap">
<div class="stats"><div class="stat"><small>ژمارەی بەرهەم</small><strong id="stat-products">0</strong></div><div class="stat"><small>ژمارەی داواکارییەکان</small><strong id="stat-orders">0</strong></div><div class="stat"><small>کۆی داواکارییەکان</small><strong id="stat-sales">0 د.ع</strong></div></div>
<div class="admin-grid"><section class="panel"><h2>➕ زیادکردنی بەرهەمی نوێ</h2><form id="product-form" class="form-grid"><label>ناوی بەرهەم<input name="name" required></label><label>بەش<select name="category"><option>ئامێرە پزیشکییەکان</option></select></label><label>نرخ بە دیناری عێراقی<input name="price" type="number" min="0" required></label><label>کۆگا / دانە<input name="stock" type="number" min="0" value="0" required></label><button class="btn btn-primary" type="submit">زیادکردنی بەرهەم</button></form></section>
<section class="panel"><h2>📦 بەڕێوەبردنی بەرهەمەکان</h2><div class="table-wrap"><table><thead><tr><th>بەرهەم</th><th>بەش</th><th>نرخ</th><th>کۆگا</th><th></th></tr></thead><tbody id="admin-products"></tbody></table></div></section></div>
<section class="panel orders-panel"><h2>داواکارییەکان</h2><div id="admin-orders"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="supabase-client.js"></script><script src="admin.js"></script><script src="admin-extra.js"></script></body></html>
